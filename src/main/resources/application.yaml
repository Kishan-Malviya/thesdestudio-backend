spring:
  application:
    name: thesdestudio-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/sde_studio
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration